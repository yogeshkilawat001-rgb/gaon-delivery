<script>
  window.addEventListener("error", (e) => showFatalError(e.message));
  window.addEventListener("unhandledrejection", (e) => showFatalError(e.reason?.message || String(e.reason)));
  function showFatalError(msg) {
    const root = document.getElementById("root");
    if (root && !document.getElementById("fatal-error-box")) {
      const linkedMsg = String(msg).replace(/(https?:\/\/[^\s]+)/g, (url) => {
        const clean = url.replace(/[.,)]+$/, "");
        return `<a href="${clean}" target="_blank" rel="noopener" style="color:#fbbf24; text-decoration:underline; word-break:break-all;">यहाँ टैप करें (index बनाएं)</a>`;
      });
      root.innerHTML = `<div id="fatal-error-box" style="padding:20px;color:#fca5a5;font-size:13px;line-height:1.6;">
        <b>कुछ गड़बड़ हुई:</b><br>${linkedMsg}<br><br>
        <span style="color:#999">अगर यह network से जुड़ी दिक्कत लगे तो बेहतर WiFi/network पर दोबारा try करें।</span>
      </div>`;
    }
  }
  setTimeout(() => {
    const root = document.getElementById("root");
    if (root && root.querySelector(".spinner") && !document.getElementById("fatal-error-box")) {
      showFatalError("App load होने में बहुत समय लग रहा है — यह अक्सर कमज़ोर internet connection की वजह से होता है। बेहतर network पर दोबारा try करें।");
    }
  }, 8000);
</script>

  } catch (e) { /* silent fail, coins are non-critical */ }
}

function formatCount(n) {
  if (n >= 10000000) return (n / 10000000).toFixed(1).replace(/\.0$/, "") + "Cr";
  if (n >= 100000) return (n / 100000).toFixed(1).replace(/\.0$/, "") + "L";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

function timeAgo(ts) {
  if (!ts) return "अभी";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return "अभी";
  if (diff < 3600) return Math.floor(diff / 60) + " मि";
  if (diff < 86400) return Math.floor(diff / 3600) + " घं";
  return Math.floor(diff / 86400) + " दिन";
}

function linkifyUrls(text) {
  return text.replace(/(https?:\/\/[^\s]+)/g, (url) => {
    const clean = url.replace(/[.,)]+$/, "");
    return `<a href="${clean}" target="_blank" rel="noopener" style="color:#fbbf24; text-decoration:underline; word-break:break-all;">यहाँ टैप करें (index बनाएं)</a>`;
  });
}

function friendlyError(e) {
  const msg = e.code || e.message || "";
  if (msg.includes("email-already-in-use")) return "यह ईमेल पहले से रजिस्टर है, लॉगिन करें";
  if (msg.includes("invalid-email")) return "ईमेल सही फॉर्मेट में डालें";
  if (msg.includes("weak-password")) return "पासवर्ड कम से कम 6 अक्षर का हो";
  if (msg.includes("invalid-credential") || msg.includes("wrong-password") || msg.includes("user-not-found")) return "ईमेल या पासवर्ड गलत है";
  const raw = e.message || "कुछ गड़बड़ हुई, दोबारा कोशिश करें";
  return linkifyUrls(raw);
}

function gridThumbHtml(post, extraClass) {
  const first = (post.media && post.media[0]) || { url: post.imageUrl, type: "image" };
  const cls = `w-full aspect-square object-cover cursor-pointer ${extraClass || ""}`;
  return first.type === "video"
    ? `<video src="${first.url}" class="${cls}" muted></video>`
    : `<img src="${first.url}" class="${cls}" />`;
}

function renderPostMedia(post) {
  const media = post.media && post.media.length ? post.media : [{ url: post.imageUrl, type: "image" }];
  if (media.length === 1) {
    const m = media[0];
    return m.type === "video"
      ? `<video src="${m.url}" class="w-full max-h-[600px] object-contain bg-black" controls playsinline></video>`
      : `<img src="${m.url}" class="w-full max-h-[600px] object-contain bg-black" />`;
  }
  const slides = media.map((m) =>
    m.type === "video"
      ? `<video src="${m.url}" class="w-full max-h-[600px] object-contain bg-black snap-center shrink-0" controls playsinline></video>`
      : `<img src="${m.url}" class="w-full max-h-[600px] object-contain bg-black snap-center shrink-0" />`
  ).join("");
  return `<div class="w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar">${slides}</div>
          <p class="text-center text-[10px] text-white/30 pt-1">1/${media.length} स्वाइप करें ›</p>`;
}

  });

    btn.onclick = () => openPostMenu(btn.dataset.id);
  });
  container.querySelectorAll(".hashtag-link").forEach((elx) => {
    elx.onclick = (ev) => { ev.stopPropagation(); renderHashtagResults(elx.dataset.tag); };
  });
  container.querySelectorAll(".save-btn").forEach((btn) => {
    btn.onclick = () => toggleSave(btn.dataset.id);
  });
  container.querySelectorAll(".mention-link").forEach((elx) => {
    elx.onclick = (ev) => { ev.stopPropagation(); goToUserByUsername(elx.dataset.user); };
  });
  container.querySelectorAll(".react-btn").forEach((btn) => {
    btn.onclick = (ev) => { ev.stopPropagation(); openReactionPicker(btn.dataset.id, btn); };
  });
  container.querySelectorAll(".quick-follow-btn").forEach((btn) => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const targetUid = btn.dataset.uid;
      btn.disabled = true;
      try {
        await updateDoc(doc(db, "users", targetUid), { followers: arrayUnion(currentUser.uid) });
        await updateDoc(doc(db, "users", currentUser.uid), { following: arrayUnion(targetUid) });
        currentFollowing.push(targetUid);
        pushNotification(targetUid, "follow", null);
        btn.remove();
      } catch (e) { alert(friendlyError(e)); btn.disabled = false; }
    };
  });
  container.querySelectorAll(".post-media-click").forEach((wrap) => {
    let tapTimer = null;
    wrap.addEventListener("click", (ev) => {
      if (ev.target.tagName === "VIDEO") return; // let native video controls work
      const postId = wrap.dataset.id;
      if (tapTimer) {
        clearTimeout(tapTimer);
        tapTimer = null;
        toggleLike(postId); // double-tap to like
      } else {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          const post = posts.find((p) => p.id === postId) || (profilePosts || []).find((p) => p.id === postId);
          if (post) openSinglePostView(post);
        }, 280);
      }
    });
  });
}

function openReactionPicker(postId, anchorBtn) {
  const existing = document.getElementById("reaction-picker");
  if (existing) existing.remove();
  const emojis = ["❤️", "🔥", "😂", "😮", "😢", "👏"];
  const rect = anchorBtn.getBoundingClientRect();
  const picker = el(`
    <div id="reaction-picker" class="fixed z-50 bg-[#12141c] border border-white/10 rounded-full px-2 py-1 flex gap-1 shadow-lg" style="top:${rect.top - 46}px; left:${Math.max(8, rect.left - 60)}px;">
      ${emojis.map((e) => `<button class="reaction-pick text-xl px-1" data-emoji="${e}">${e}</button>`).join("")}
    </div>
  `);
  document.body.appendChild(picker);
  picker.querySelectorAll(".reaction-pick").forEach((b) => {
    b.onclick = async () => {
      await setPostReaction(postId, b.dataset.emoji);
      picker.remove();
    };
  });
  setTimeout(() => {
    document.addEventListener("click", function closePicker(ev) {
      if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener("click", closePicker); }
    });
  }, 0);
}

async function setPostReaction(postId, emoji) {
  const post = posts.find((p) => p.id === postId) || (profilePosts || []).find((p) => p.id === postId);
  const current = post?.reactions?.[currentUser.uid];
  const refDoc = doc(db, "posts", postId);
  try {
    if (current === emoji) {
      await updateDoc(refDoc, { [`reactions.${currentUser.uid}`]: deleteField() });
    } else {
      await updateDoc(refDoc, { [`reactions.${currentUser.uid}`]: emoji });
      if (post && post.uid !== currentUser.uid) { pushNotification(post.uid, "reaction", postId); awardCoins(postId, post.uid, COIN_PER_REACTION); }
    }
  } catch (e) { alert(friendlyError(e)); }
}

async function toggleSave(postId) {

  try {

      savedPosts: saved ? arrayRemove(postId) : arrayUnion(postId)

    currentSavedPosts = saved ? currentSavedPosts.filter((id) => id !== postId) : [...currentSavedPosts, postId];
    if (currentView === "home") renderFeed();
  } catch (e) { alert(friendlyError(e)); }
}

async function shareProfile(uid, username) {
  const url = `${location.origin}${location.pathname}?profile=${uid}`;
  const shareData = { title: `${username} पर Reelbaazi`, text: `${username} की Reelbaazi profile देखें`, url };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(url);
      alert("प्रोफाइल का लिंक कॉपी हो गया — कहीं भी पेस्ट करके भेज सकते हैं");
    }
  } catch (e) {
    try {
      await navigator.clipboard.writeText(url);
      alert("प्रोफाइल का लिंक कॉपी हो गया — कहीं भी पेस्ट करके भेज सकते हैं");
    } catch (e2) { /* user cancelled share, ignore */ }
  }

function extractHashtags(text) {
  const matches = text.match(/#[\u0900-\u097Fa-zA-Z0-9_]+/g) || [];
  return [...new Set(matches.map((h) => h.slice(1).toLowerCase()))];
}

function extractMentions(text) {
  const matches = text.match(/@[a-zA-Z0-9_]+/g) || [];
  return [...new Set(matches.map((m) => m.slice(1)))];
}

function linkifyCaption(text) {
  if (!text) return "";
  let out = text.replace(/#([\u0900-\u097Fa-zA-Z0-9_]+)/g, `<span class="hashtag-link text-amber-400 cursor-pointer" data-tag="$1">#$1</span>`);
  out = out.replace(/@([a-zA-Z0-9_]+)/g, `<span class="mention-link text-sky-400 cursor-pointer" data-user="$1">@$1</span>`);
  return out;
}

  function show(i) {
    if (i < 0) i = 0;
    if (i >= list.length) { overlay.remove(); return; }
    idx = i;
    document.getElementById("story-img").src = list[idx].imageUrl;
    Array.from(bar.children).forEach((b, j) => b.classList.toggle("bg-white", j <= idx));
    const isMine = list[idx].uid === currentUser.uid;
    const replyBox = overlay.querySelector(".absolute.bottom-4");

  document.getElementById("story-prev").onclick = () => show(idx - 1);
  document.getElementById("story-next").onclick = () => show(idx + 1);

    const story = list[idx];
    if (!text.trim()) return;
    await startChatSilent(story.uid, story.username);

    status.textContent = "भेज दिया गया ✓";
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 1500);
  }

  document.getElementById("story-reply-send").onclick = () => {
    const input = document.getElementById("story-reply-input");
    sendStoryReply(input.value);
    input.value = "";
  };
  document.getElementById("story-reply-input").onkeydown = (e) => {
    if (e.key === "Enter") { sendStoryReply(e.target.value); e.target.value = ""; }
  };
  overlay.querySelectorAll(".story-react-emoji").forEach((btn) => {
    btn.onclick = () => sendStoryReply(btn.dataset.emoji);
  });
}

async function startChatSilent(otherUid, otherUsername) {
  const convId = convIdFor(currentUser.uid, otherUid);
  const convRef = doc(db, "conversations", convId);

  if (!snap.exists()) {
    await setDoc(convRef, {
      participants: [currentUser.uid, otherUid],
      usernames: { [currentUser.uid]: currentUsername, [otherUid]: otherUsername },
      lastMessage: "", lastMessageAt: serverTimestamp()
    });
  }
}

      });
      drawProfileGrid(videoOnly);

      setActiveTab("ptab-saved");

        return;

function drawProfileGrid(list) {
  const grid = document.getElementById("profile-grid");
  if (!grid) return;

    grid.innerHTML = `<p class="col-span-3 text-center text-white/30 text-sm py-10">अभी कोई पोस्ट नहीं है</p>`;
    return;
  }
  grid.innerHTML = "";
  list.forEach((post) => {
    const thumb = el(gridThumbHtml(post));
    thumb.onclick = () => openSinglePostView(post);
    grid.appendChild(thumb);
  });
}

// ---------- SEARCH ----------
function renderSearch() {
  const feedEl = document.getElementById("feed");
  const storiesRow = document.getElementById("stories-row");
  if (storiesRow) storiesRow.classList.add("hidden");
  updateNavHighlight();
  feedEl.innerHTML = `
    <div class="px-4 py-3 sticky top-0 bg-[#0B0B0F] z-10">
      <input id="search-input" placeholder="यूज़रनेम खोजें..." class="w-full bg-white/5 rounded-full px-4 py-2.5 outline-none placeholder:text-white/30 text-sm" />
    </div>
    <div id="search-results" class="px-2"></div>
  `;
  const input = document.getElementById("search-input");
  input.focus();
  let debounce;
  input.oninput = () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => runSearch(input.value.trim()), 300);
  };
}

async function runSearch(term) {
  const results = document.getElementById("search-results");
  if (!results) return;
  if (!term) { results.innerHTML = ""; return; }
  if (term.startsWith("#")) {
    renderHashtagResults(term.slice(1).toLowerCase(), results);
    return;
  }
  results.innerHTML = `<div class="flex justify-center py-6"><div class="spinner"></div></div>`;
  try {
    const q = query(
      collection(db, "users"),
      orderBy("username"),
      where("username", ">=", term),
      where("username", "<=", term + "\uf8ff"),
      limit(20)
    );
    const snap = await getDocs(q);
    if (snap.empty) {
      results.innerHTML = `<p class="text-center text-white/30 text-sm py-10">कोई यूज़र नहीं मिला</p>`;
      return;
    }
    results.innerHTML = "";
    snap.forEach((d) => {
      const u = d.data();
      const row = el(`
        <div class="flex items-center gap-3 px-2 py-3 border-b border-white/5 cursor-pointer">
          <div class="w-10 h-10 rounded-full ring-story p-[2px]"><div class="w-full h-full rounded-full bg-[#0B0B0F] flex items-center justify-center">👤</div></div>
          <span class="text-sm font-medium">${u.username}</span>
        </div>
      `);
      row.onclick = () => { currentView = "profile"; renderProfile(d.id); };
      results.appendChild(row);
    });
  } catch (e) {
    results.innerHTML = `<p class="text-center text-rose-400 text-sm py-10 px-4">${friendlyError(e)}</p>`;
  }
}


// ---------- NOTIFICATIONS ----------
async function pushNotification(toUid, type, postId) {
  if (toUid === currentUser.uid) return; // don't notify yourself
  try {
    await addDoc(collection(db, "notifications"), {
      toUid, fromUid: currentUser.uid, fromUsername: currentUsername,
      type, postId: postId || null, read: false, createdAt: serverTimestamp()
    });
  } catch (e) { /* silent fail */ }
}

function listenNotifications() {
  if (unsubNotifications) unsubNotifications();
  const q = query(collection(db, "notifications"), where("toUid", "==", currentUser.uid), where("read", "==", false));
  unsubNotifications = onSnapshot(q, (snap) => {
    const badge = document.getElementById("notif-badge");
    if (!badge) return;
    if (snap.size > 0) {
      badge.textContent = snap.size > 9 ? "9+" : String(snap.size);
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  }, () => {});
}

function notifText(n) {
  if (n.type === "like") return `${n.fromUsername} ने आपकी पोस्ट लाइक की`;
  if (n.type === "comment") return `${n.fromUsername} ने आपकी पोस्ट पर कमेंट किया`;
  if (n.type === "follow") return `${n.fromUsername} ने आपको फॉलो किया`;
  if (n.type === "mention") return `${n.fromUsername} ने आपको एक पोस्ट में मेंशन किया`;
  if (n.type === "reaction") return `${n.fromUsername} ने आपकी पोस्ट पर रिएक्ट किया`;
  return `${n.fromUsername} की नई गतिविधि`;
}

  const overlay = el(`
    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
      <div class="w-full max-w-md bg-[#12141c] rounded-t-2xl max-h-[80vh] flex flex-col border-t border-white/10">
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
          <span class="font-semibold text-sm">नोटिफिकेशन्स</span>
          <button id="nf-close" class="text-white/60">✕</button>
        </div>
        <div id="nf-list" class="flex-1 overflow-y-auto px-4 py-3 space-y-1">

        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  document.getElementById("nf-close").onclick = () => overlay.remove();

  const q = query(collection(db, "notifications"), where("toUid", "==", currentUser.uid), limit(100));
  const list = document.getElementById("nf-list");
  let snap;
  try {

  } catch (e) {
    list.innerHTML = `<p class="text-center text-rose-400 text-sm py-10 px-6">${friendlyError(e)}<br><span class="text-white/30 text-xs">अगर "index" से जुड़ा error है, तो Firestore console में जाकर वो index बनाना ज़रूरी है (कुछ मिनट में तैयार हो जाता है)</span></p>`;
    return;
  }
  if (snap.empty) {
    list.innerHTML = `<p class="text-white/40 text-sm text-center py-10">अभी कोई नोटिफिकेशन नहीं है</p>`;
    return;
  }
  const notifDocs = snap.docs.slice().sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));
  list.innerHTML = "";
  notifDocs.forEach((d) => {
    const n = d.data();

        <div class="w-8 h-8 rounded-full bg-amber-500/20 flex items-center justify-center shrink-0">
          ${n.type === "like" ? "❤️" : n.type === "comment" ? "💬" : n.type === "mention" ? "@" : n.type === "reaction" ? "😊" : "➕"}
        </div>
        <div class="flex-1">${notifText(n)}<div class="text-[10px] text-white/30">${timeAgo(n.createdAt)}</div></div>
      </div>
    `);
    list.appendChild(row);
    if (!n.read) updateDoc(doc(db, "notifications", d.id), { read: true }).catch(() => {});
  });
}


// ---------- DIRECT MESSAGES ----------
function convIdFor(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}

async function startChat(otherUid, otherUsername) {
  const convId = convIdFor(currentUser.uid, otherUid);
  const convRef = doc(db, "conversations", convId);
  const snap = await getDoc(convRef);
  if (!snap.exists()) {
    await setDoc(convRef, {
      participants: [currentUser.uid, otherUid],
      usernames: { [currentUser.uid]: currentUsername, [otherUid]: otherUsername },
      lastMessage: "", lastMessageAt: serverTimestamp()
    });
  }
  openChat(convId, otherUid, otherUsername);
}

let unsubChat = null;
let currentIsAdmin = false;
let currentBlockedUsers = [];
function openChat(convId, otherUid, chatName, isGroup) {
  const overlay = el(`
    <div class="fixed inset-0 z-50 bg-[#0B0B0F] flex flex-col">
      <div class="flex items-center gap-3 px-4 py-3 border-b border-white/5">
        <button id="chat-close" class="text-white/70">←</button>
        <div class="w-8 h-8 rounded-full ${isGroup ? "bg-fuchsia-500/30" : "ring-story p-[2px]"} flex items-center justify-center"><div class="w-full h-full rounded-full bg-[#0B0B0F] flex items-center justify-center text-sm">${isGroup ? "👥" : "👤"}</div></div>
        <span class="font-semibold text-sm">${chatName}</span>
      </div>
      <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>
      <div id="chat-record-status" class="hidden px-4 py-1 text-xs text-rose-400">🔴 रिकॉर्ड हो रहा है... (रोकने के लिए दोबारा दबाएं)</div>
      <div class="flex items-center gap-2 px-4 py-3 border-t border-white/5">
        <button id="chat-voice-btn" class="text-xl">🎤</button>
        <input id="chat-input" placeholder="मैसेज लिखें..." class="flex-1 bg-white/5 rounded-full px-4 py-2 outline-none placeholder:text-white/30 text-sm" />
        <button id="chat-send" class="text-amber-400 font-semibold text-sm">भेजें</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  document.getElementById("chat-close").onclick = () => { overlay.remove(); if (unsubChat) unsubChat(); };

  const q = query(collection(db, "conversations", convId, "messages"), orderBy("createdAt", "asc"));
  if (unsubChat) unsubChat();
  unsubChat = onSnapshot(q, (snap) => {
    const list = document.getElementById("chat-messages");
    if (!list) return;
    list.innerHTML = "";
    snap.forEach((d) => {
      const m = d.data();
      const mine = m.fromUid === currentUser.uid;
      const bodyHtml = m.type === "voice"
        ? `<audio src="${m.audioUrl}" controls class="max-w-[220px] h-9"></audio>`
        : m.text;
      list.appendChild(el(`
        <div class="flex ${mine ? "justify-end" : "justify-start"}">
          <div class="max-w-[75%] px-3 py-2 rounded-2xl text-sm ${mine ? "bg-amber-500 text-black" : "bg-white/10 text-white"}">
            ${isGroup && !mine ? `<p class="text-[10px] text-amber-400 font-semibold mb-0.5">${m.fromUsername || ""}</p>` : ""}
            ${bodyHtml}
          </div>
        </div>
      `));
    });
    list.scrollTop = list.scrollHeight;
  });

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  document.getElementById("chat-voice-btn").onclick = async () => {
    const statusEl = document.getElementById("chat-record-status");
    const voiceBtn = document.getElementById("chat-voice-btn");
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          statusEl.classList.add("hidden");
          voiceBtn.textContent = "🎤";
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          const file = new File([blob], `voice_${Date.now()}.webm`, { type: "audio/webm" });
          try {
            const audioUrl = await uploadToCloudinary(file, "video");
            await addDoc(collection(db, "conversations", convId, "messages"), {
              fromUid: currentUser.uid, fromUsername: currentUsername, type: "voice", audioUrl, createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, "conversations", convId), { lastMessage: "🎤 वॉइस मैसेज", lastMessageAt: serverTimestamp() });
          } catch (e) { alert(friendlyError(e)); }
        };
        mediaRecorder.start();
        isRecording = true;
        voiceBtn.textContent = "⏹️";
        statusEl.classList.remove("hidden");
      } catch (e) {
        alert("माइक्रोफ़ोन की permission चाहिए वॉइस मैसेज के लिए");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
    }
  };

  const send = async () => {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    await addDoc(collection(db, "conversations", convId, "messages"), {
      fromUid: currentUser.uid, fromUsername: currentUsername, text, createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "conversations", convId), { lastMessage: (isGroup ? currentUsername + ": " : "") + text, lastMessageAt: serverTimestamp() });
  };
  document.getElementById("chat-send").onclick = send;
  document.getElementById("chat-input").onkeydown = (e) => { if (e.key === "Enter") send(); };
}

    return;
  }
  list.innerHTML = "";
  const convDocs = snap.docs.slice().sort((a, b) => (b.data().lastMessageAt?.toMillis?.() || 0) - (a.data().lastMessageAt?.toMillis?.() || 0));
  convDocs.forEach((d) => {
    const c = d.data();
    const isGroup = c.isGroup;
    const otherUid = isGroup ? null : c.participants.find((p) => p !== currentUser.uid);

        </div>
      </div>
    `);
    row.onclick = () => { overlay.remove(); openChat(d.id, otherUid, chatName, isGroup); };
    list.appendChild(row);
  });
}

async function openCreateGroup() {
  const overlay = el(`
    <div class="fixed inset-0 z-50 bg-[#0B0B0F] flex flex-col">
      <div class="flex items-center gap-3 px-4 py-3 border-b border-white/5">
        <button id="cg-close" class="text-white/70">←</button>
        <span class="font-semibold text-sm">नया ग्रुप</span>
      </div>
      <div class="p-4 space-y-3">
        <input id="cg-name" placeholder="ग्रुप का नाम" class="w-full bg-white/5 rounded-lg px-4 py-3 outline-none placeholder:text-white/30 text-sm" />
        <input id="cg-search" placeholder="यूज़रनेम खोजकर जोड़ें..." class="w-full bg-white/5 rounded-full px-4 py-2.5 outline-none placeholder:text-white/30 text-sm" />
        <div id="cg-selected" class="flex flex-wrap gap-2"></div>
        <div id="cg-results" class="space-y-1"></div>
      </div>
      <div class="mt-auto p-4">
        <button id="cg-create" disabled class="w-full bg-white/10 text-white/30 font-semibold rounded-full py-3 text-sm">ग्रुप बनाएं</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  document.getElementById("cg-close").onclick = () => overlay.remove();
  const selected = new Map();

  function renderSelected() {
    const wrap = document.getElementById("cg-selected");
    wrap.innerHTML = "";
    selected.forEach((uname, uid) => {
      wrap.appendChild(el(`<span class="text-xs bg-amber-500/20 text-amber-400 rounded-full px-3 py-1">${uname} ✕</span>`)).onclick = () => {
        selected.delete(uid); renderSelected();
      };
    });
    const btn = document.getElementById("cg-create");
    btn.disabled = selected.size < 2;
    btn.className = selected.size < 2
      ? "w-full bg-white/10 text-white/30 font-semibold rounded-full py-3 text-sm"
      : "w-full bg-gradient-to-r from-amber-400 to-rose-500 text-black font-semibold rounded-full py-3 text-sm";
  }

  let debounce;
  document.getElementById("cg-search").oninput = (e) => {
    clearTimeout(debounce);
    const term = e.target.value.trim();
    debounce = setTimeout(async () => {
      const results = document.getElementById("cg-results");
      if (!term) { results.innerHTML = ""; return; }
      const snap = await getDocs(query(collection(db, "users"), orderBy("username"), where("username", ">=", term), where("username", "<=", term + "\uf8ff"), limit(10)));
      results.innerHTML = "";
      snap.forEach((d) => {
        if (d.id === currentUser.uid || selected.has(d.id)) return;
        const u = d.data();
        const row = el(`<div class="flex items-center justify-between px-2 py-2 border-b border-white/5"><span class="text-sm">${u.username}</span><button class="text-amber-400 text-xs">+ जोड़ें</button></div>`);
        row.querySelector("button").onclick = () => { selected.set(d.id, u.username); renderSelected(); };
        results.appendChild(row);
      });
    }, 300);
  };

  document.getElementById("cg-create").onclick = async () => {
    if (selected.size < 2) return;
    const groupName = document.getElementById("cg-name").value.trim() || "ग्रुप चैट";
    const participants = [currentUser.uid, ...selected.keys()];
    const usernames = { [currentUser.uid]: currentUsername };
    selected.forEach((uname, uid) => { usernames[uid] = uname; });
    const convRef = await addDoc(collection(db, "conversations"), {
      participants, usernames, isGroup: true, groupName,
      lastMessage: "", lastMessageAt: serverTimestamp()
    });
    overlay.remove();
    openChat(convRef.id, null, groupName, true);
  };
}

        <p class="text-[10px] text-white/30 mt-1">${timeAgo(r.createdAt)}</p>

// ---------- REELS ----------
let reelsMuted = true; // starts muted (browser requirement), persists once user unmutes by tapping a video
async function renderReels() {
  const feedEl = document.getElementById("feed");
  const storiesRow = document.getElementById("stories-row");
  if (storiesRow) storiesRow.classList.add("hidden");
  updateNavHighlight();
  feedEl.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;
  try {
    const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100)));
    const videoPosts = [];
    snap.forEach((d) => {
      const p = { id: d.id, ...d.data() };
      if (currentBlockedUsers.includes(p.uid)) return;
      const media = p.media && p.media.length ? p.media : [{ url: p.imageUrl, type: "image" }];
      if (media.some((m) => m.type === "video")) videoPosts.push(p);
    });
    if (!videoPosts.length) {
      feedEl.innerHTML = `<p class="text-center text-white/30 text-sm py-16 px-8">अभी कोई वीडियो पोस्ट नहीं है</p>`;
      return;
    }
    feedEl.innerHTML = `<div id="reels-scroll" class="h-[calc(100vh-140px)] overflow-y-auto snap-y snap-mandatory no-scrollbar"></div>`;
    const scroller = document.getElementById("reels-scroll");
    videoPosts.forEach((post) => {
      const vid = (post.media && post.media.find((m) => m.type === "video")) || { url: post.imageUrl };
      const liked = (post.likes || []).includes(currentUser.uid);
      const likeCount = (post.likes || []).length;
      const commentCount = post.commentCount || 0;
      const saved = currentSavedPosts.includes(post.id);
      const savedCount = 0; // per-post save count not tracked globally, shown only as icon state
      const slide = el(`
        <div class="relative h-full w-full snap-start flex items-center justify-center bg-black">
          <video src="${vid.url}" class="w-full h-full object-contain" loop playsinline autoplay></video>
          <div class="reel-mute-hint absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/50 text-white text-xs px-3 py-1.5 rounded-full ${reelsMuted ? "" : "hidden"}">🔇 आवाज़ के लिए टैप करें</div>
          <div class="absolute bottom-4 left-3 right-16 text-white text-sm">
            <p class="font-semibold">${post.username}</p>
            <p class="text-xs text-white/80 mt-1">${linkifyCaption(post.caption || "")}</p>
          </div>
          <div class="absolute bottom-4 right-2 flex flex-col items-center gap-4 text-white">
            <button class="reel-like flex flex-col items-center gap-0.5" data-id="${post.id}">
              <span class="text-3xl leading-none">${liked ? "❤️" : "🤍"}</span>
              <span class="reel-like-count text-[11px] font-semibold">${formatCount(likeCount)}</span>
            </button>
            <button class="reel-comment flex flex-col items-center gap-0.5" data-id="${post.id}">
              <span class="text-3xl leading-none">💬</span>
              <span class="text-[11px] font-semibold">${formatCount(commentCount)}</span>
            </button>
            <button class="reel-share flex flex-col items-center gap-0.5" data-id="${post.id}">
              <span class="text-3xl leading-none">➤</span>
              <span class="text-[11px] font-semibold">शेयर</span>
            </button>
            <button class="reel-save flex flex-col items-center gap-0.5" data-id="${post.id}">
              <span class="reel-save-icon text-3xl leading-none">${saved ? "🔖" : "📑"}</span>
              <span class="text-[11px] font-semibold">सेव</span>
            </button>
          </div>
        </div>
      `);
      const videoEl = slide.querySelector("video");
      videoEl.muted = reelsMuted;
      // tap anywhere on the video to toggle sound for all reels (state persists)
      videoEl.onclick = () => {
        reelsMuted = !reelsMuted;
        scroller.querySelectorAll("video").forEach((v) => { v.muted = reelsMuted; });
        scroller.querySelectorAll(".reel-mute-hint").forEach((h) => h.classList.toggle("hidden", !reelsMuted));
      };
      slide.querySelector(".reel-like").onclick = (ev) => {
        const btn = ev.currentTarget;
        toggleLikeDirect(post, btn.querySelector("span"));
        btn.querySelector(".reel-like-count").textContent = formatCount((post.likes || []).length);
      };
      slide.querySelector(".reel-comment").onclick = () => openComments(post.id);
      slide.querySelector(".reel-share").onclick = () => shareProfile(post.uid, post.username);
      slide.querySelector(".reel-save").onclick = async (ev) => {
        await toggleSave(post.id);
        const nowSaved = currentSavedPosts.includes(post.id);
        ev.currentTarget.querySelector(".reel-save-icon").textContent = nowSaved ? "🔖" : "📑";
      };
      scroller.appendChild(slide);
    });

    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const v = entry.target.querySelector("video");
        if (!v) return;
        if (entry.isIntersecting) v.play().catch(() => {}); else v.pause();
      });
    }, { root: scroller, threshold: 0.6 });
    scroller.querySelectorAll(".snap-start").forEach((s) => io.observe(s));
  } catch (e) {
    feedEl.innerHTML = `<p class="text-center text-rose-400 text-sm py-10 px-6">${friendlyError(e)}</p>`;
  }
}

// ---------- EXPLORE ----------
async function renderExplore() {
  const feedEl = document.getElementById("feed");
  const storiesRow = document.getElementById("stories-row");
  if (storiesRow) storiesRow.classList.add("hidden");
  updateNavHighlight();
  feedEl.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;
  try {
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(150));
    const snap = await getDocs(q);
    if (snap.empty) {
      feedEl.innerHTML = `<p class="text-center text-white/30 text-sm py-16 px-8">अभी कोई पोस्ट नहीं है</p>`;
      return;
    }
    let allPosts = [];
    snap.forEach((d) => {
      const post = { id: d.id, ...d.data() };
      if (!currentBlockedUsers.includes(post.uid)) allPosts.push(post);
    });

    feedEl.innerHTML = `
      <div class="flex gap-2 px-3 py-2 sticky top-0 bg-[#0B0B0F] z-10">
        <button id="explore-trending-tab" class="text-xs font-semibold rounded-full px-4 py-1.5 bg-amber-500 text-black">🔥 ट्रेंडिंग</button>
        <button id="explore-latest-tab" class="text-xs font-semibold rounded-full px-4 py-1.5 bg-white/10 text-white">🆕 लेटेस्ट</button>
      </div>
      <div id="explore-grid" class="grid grid-cols-3 gap-0.5"></div>
    `;

    function score(post) {
      const likeCount = (post.likes || []).length;
      const reactionCount = post.reactions ? Object.keys(post.reactions).length : 0;
      const commentCount = post.commentCount || 0;
      const engagement = likeCount + reactionCount * 1.2 + commentCount * 2;
      const t = post.createdAt?.toDate ? post.createdAt.toDate().getTime() : Date.now();
      const hoursOld = Math.max(1, (Date.now() - t) / 3600000);
      return engagement / Math.pow(hoursOld + 2, 1.5); // recency-weighted engagement (Hacker News style decay)
    }

    function draw(list) {
      const grid = document.getElementById("explore-grid");
      grid.innerHTML = "";
      list.forEach((post) => {
        const thumb = el(gridThumbHtml(post));
        thumb.onclick = () => openSinglePostView(post);
        grid.appendChild(thumb);
      });
    }

    const trending = [...allPosts].sort((a, b) => score(b) - score(a));
    draw(trending);

    document.getElementById("explore-trending-tab").onclick = () => {
      document.getElementById("explore-trending-tab").className = "text-xs font-semibold rounded-full px-4 py-1.5 bg-amber-500 text-black";
      document.getElementById("explore-latest-tab").className = "text-xs font-semibold rounded-full px-4 py-1.5 bg-white/10 text-white";
      draw(trending);
    };
    document.getElementById("explore-latest-tab").onclick = () => {
      document.getElementById("explore-latest-tab").className = "text-xs font-semibold rounded-full px-4 py-1.5 bg-amber-500 text-black";
      document.getElementById("explore-trending-tab").className = "text-xs font-semibold rounded-full px-4 py-1.5 bg-white/10 text-white";
      draw(allPosts);
    };
  } catch (e) {
    feedEl.innerHTML = `<p class="text-center text-rose-400 text-sm py-10 px-6">${friendlyError(e)}</p>`;
  }
}

// ---------- HASHTAGS ----------
async function renderHashtagResults(tag, targetEl) {
  currentView = "hashtag";
  const container = targetEl || document.getElementById("feed");
  const storiesRow = document.getElementById("stories-row");
  if (!targetEl && storiesRow) storiesRow.classList.add("hidden");
  if (!targetEl) updateNavHighlight();
  container.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;
  try {
    const q = query(collection(db, "posts"), where("hashtags", "array-contains", tag), limit(60));
    const snap = await getDocs(q);
    if (snap.empty) {
      container.innerHTML = `<p class="text-center text-white/30 text-sm py-16 px-8">#${tag} पर कोई पोस्ट नहीं मिली</p>`;
      return;
    }
    container.innerHTML = `<p class="px-4 py-2 text-sm text-white/50">#${tag} — ${snap.size} पोस्ट्स</p><div id="tag-grid" class="grid grid-cols-3 gap-0.5"></div>`;
    const grid = document.getElementById("tag-grid");
    const tagDocs = snap.docs.slice().sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));
    tagDocs.forEach((d) => {
      const post = { id: d.id, ...d.data() };
      const thumb = el(gridThumbHtml(post));
      thumb.onclick = () => openSinglePostView(post);
      grid.appendChild(thumb);
    });
  } catch (e) {
    container.innerHTML = `<p class="text-center text-rose-400 text-sm py-10 px-6">${friendlyError(e)}</p>`;
  }
}

// ---------- BLOCK / REPORT ----------
async function openUserOptionsMenu(uid, username) {
  const myDoc = await getDoc(doc(db, "users", currentUser.uid));
  const blocked = (myDoc.exists() && myDoc.data().blockedUsers) || [];
  const isBlocked = blocked.includes(uid);
  const overlay = el(`
    <div class="fixed inset-0 z-50 bg-black/60 flex items-end justify-center">
      <div class="w-full max-w-md bg-[#12141c] rounded-t-2xl border-t border-white/10 overflow-hidden">
        <button id="um-block" class="w-full text-center py-4 text-sm text-rose-400 border-b border-white/10">${isBlocked ? "अनब्लॉक करें" : "ब्लॉक करें"}</button>
        <button id="um-report" class="w-full text-center py-4 text-sm text-rose-400 border-b border-white/10">रिपोर्ट करें</button>
        <button id="um-cancel" class="w-full text-center py-4 text-sm text-white/50">रद्द करें</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  document.getElementById("um-cancel").onclick = () => overlay.remove();
  document.getElementById("um-block").onclick = async () => {
    overlay.remove();
    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        blockedUsers: isBlocked ? arrayRemove(uid) : arrayUnion(uid)
      }, { merge: true });
      alert(isBlocked ? `${username} को अनब्लॉक कर दिया` : `${username} को ब्लॉक कर दिया, अब उनकी पोस्ट्स आपको नहीं दिखेंगी`);
      if (currentView === "home") showHome();
    } catch (e) { alert(friendlyError(e)); }
  };
  document.getElementById("um-report").onclick = async () => {
    overlay.remove();
    const reason = prompt("रिपोर्ट का कारण (optional):", "");
    try {
      await addDoc(collection(db, "reports"), {
        reportedUid: uid, reportedUsername: username,
        reporterUid: currentUser.uid, reporterUsername: currentUsername,
        reason: reason || "", createdAt: serverTimestamp()
      });
      alert("रिपोर्ट भेज दी गई, धन्यवाद");
    } catch (e) { alert(friendlyError(e)); }
  };
}

// ---------- SETTINGS ----------
function applyTheme(theme) {
  const gradient = "linear-gradient(135deg, #1a0b2e 0%, #3b0764 20%, #831843 45%, #7c2d12 70%, #1e1b4b 100%)";
  document.documentElement.setAttribute("data-theme", theme);
  if (theme === "light") {
    document.documentElement.style.background = "#F5F5F7";
    document.body.style.background = "#F5F5F7";
  } else {
    document.documentElement.style.background = gradient;
    document.body.style.background = gradient;
  }
  document.body.style.color = theme === "light" ? "#111" : "#fff";
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute("content", theme === "light" ? "#F5F5F7" : "#1a0b2e");
  try { localStorage.setItem("instamoney-theme", theme); } catch (e) {}
}

function openSettings() {
  let theme = "dark";
  try { theme = localStorage.getItem("instamoney-theme") || "dark"; } catch (e) {}
  const overlay = el(`
    <div class="fixed inset-0 z-50 bg-[#0B0B0F] flex flex-col">
      <div class="flex items-center gap-3 px-4 py-3 border-b border-white/5">
        <button id="settings-close" class="text-white/70">←</button>
        <span class="font-semibold text-sm">सेटिंग्स</span>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3">
        <button id="set-username-btn" class="w-full text-left bg-white/5 rounded-lg px-4 py-3 text-sm">यूज़रनेम बदलें</button>
        <div class="bg-white/5 rounded-lg px-4 py-3 flex items-center justify-between">
          <span class="text-sm">थीम</span>
          <div class="flex gap-2">
            <button id="theme-dark" class="text-xs px-3 py-1 rounded-full ${theme === "dark" ? "bg-amber-500 text-black" : "bg-white/10"}">डार्क</button>
            <button id="theme-light" class="text-xs px-3 py-1 rounded-full ${theme === "light" ? "bg-amber-500 text-black" : "bg-white/10"}">लाइट</button>
          </div>
        </div>
        <button id="set-logout-btn" class="w-full text-left bg-white/5 rounded-lg px-4 py-3 text-sm">लॉगआउट</button>
        <button id="set-delete-btn" class="w-full text-left bg-rose-500/10 text-rose-400 rounded-lg px-4 py-3 text-sm">अकाउंट डिलीट करें</button>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  document.getElementById("settings-close").onclick = () => overlay.remove();
  document.getElementById("theme-dark").onclick = () => { applyTheme("dark"); overlay.remove(); openSettings(); };
  document.getElementById("theme-light").onclick = () => { applyTheme("light"); overlay.remove(); openSettings(); };
  document.getElementById("set-logout-btn").onclick = () => { overlay.remove(); signOut(auth); };

  document.getElementById("set-username-btn").onclick = async () => {
    const newName = prompt("नया यूज़रनेम:", currentUsername);
    if (newName && newName.trim()) {
      try {
        await setDoc(doc(db, "users", currentUser.uid), { username: newName.trim() }, { merge: true });
        currentUsername = newName.trim();
        overlay.remove();
        renderApp();
      } catch (e) { alert(friendlyError(e)); }
    }
  };

  document.getElementById("set-delete-btn").onclick = async () => {
    if (!confirm("क्या आप वाकई अपना अकाउंट पूरी तरह डिलीट करना चाहते हैं? यह वापस नहीं हो सकता।")) return;
    try {
      const postsSnap = await getDocs(query(collection(db, "posts"), where("uid", "==", currentUser.uid)));
      for (const d of postsSnap.docs) await deleteDoc(doc(db, "posts", d.id));
      await deleteDoc(doc(db, "users", currentUser.uid));
      await deleteUser(currentUser);
      overlay.remove();
    } catch (e) {
      if ((e.code || "").includes("requires-recent-login")) {
        alert("सुरक्षा कारणों से, अकाउंट डिलीट करने के लिए दोबारा लॉगिन करें, फिर तुरंत यह step दोहराएं।");
        signOut(auth);
      } else {
        alert(friendlyError(e));
      }
    }
  };
}


try { applyTheme(localStorage.getItem("instamoney-theme") || "dark"); } catch (e) {}
root.innerHTML = `<div class="flex items-center justify-center min-h-screen"><div class="spinner"></div></div>`;
onAuthStateChanged(auth, async (user) => {
  if (unsubPosts) { unsubPosts(); unsubPosts = null; }
  if (unsubComments) { unsubComments(); unsubComments = null; }
  if (unsubStories) { unsubStories(); unsubStories = null; }
  if (unsubNotifications) { unsubNotifications(); unsubNotifications = null; }
  if (unsubChat) { unsubChat(); unsubChat = null; }
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    currentUsername = snap.exists() ? snap.data().username : (user.displayName || "user");
    currentIsAdmin = (snap.exists() && !!snap.data().isAdmin) || user.email === OWNER_ADMIN_EMAIL;
    if (currentIsAdmin && snap.exists() && !snap.data().isAdmin) {
      setDoc(doc(db, "users", user.uid), { isAdmin: true }, { merge: true }).catch(() => {});
    }
    currentBlockedUsers = snap.exists() ? (snap.data().blockedUsers || []) : [];
    currentSavedPosts = snap.exists() ? (snap.data().savedPosts || []) : [];
    currentFollowing = snap.exists() ? (snap.data().following || []) : [];
    renderApp();
    const sharedProfileUid = new URLSearchParams(location.search).get("profile");
    if (sharedProfileUid) {
      currentView = "profile";
      renderProfile(sharedProfileUid);
      history.replaceState(null, "", location.pathname);
    }
  } else {
    currentUser = null;
    renderAuth("login");
  }
});
